name: u12-academico

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academico
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: academico
    volumes:
      - datos_academicos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    stop_grace_period: 30s
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/academico
      DB_USER: academico
      DB_PASSWORD: academico
      # Vacío o "none" = sin caché; "simple" = caché local de laboratorio (ver README.md).
      CACHE_TYPE: ${CACHE_TYPE:-none}
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build: .
    profiles: ["replica"]
    stop_grace_period: 30s
    ports: ["8081:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/academico
      DB_USER: academico
      DB_PASSWORD: academico
      CACHE_TYPE: ${CACHE_TYPE:-none}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos_academicos:
